<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoBooth AI - Virtual Photobooth</title>
    <style>
        /* --- CSS (DESAIN UI/UX) --- */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance {
            background: #2a2a2a;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            color: #4CAF50;
            font-weight: bold;
        }

        /* Layout Utama */
        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            padding: 40px 20px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
        }

        /* Area Kamera */
        .camera-section {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .camera-view {
            width: 100%;
            height: 350px;
            background: #000;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #444;
            position: relative;
            overflow: hidden;
        }

        .camera-view img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .btn-capture {
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn-capture:hover {
            transform: scale(1.05);
        }

        /* Area Filter & Bisnis */
        .filter-section {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }

        h3 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .filter-card {
            background: #2a2a2a;
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-card:hover {
            border-color: #555;
        }

        .filter-card.active {
            border-color: #ff00cc;
            background: #3a1a3a;
        }

        .filter-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .filter-price {
            font-size: 12px;
            color: #aaa;
        }

        .premium-tag {
            color: #ffcc00;
            font-size: 11px;
            font-weight: bold;
        }

        /* Overlay Loading AI */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #ff00cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
